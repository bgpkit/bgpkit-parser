name: build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Run format check
        run: cargo fmt --check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Check documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --all-features --no-deps

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build default
        run: cargo build

      - name: Build cli
        run: cargo build --features cli

      - name: Build no-default-features
        run: cargo build --no-default-features

      - name: Build examples
        run: cargo build --examples

      - name: Run tests
        run: cargo test --all-features

  wasm-types:
    name: WASM TS Types & Fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Regenerate TS bindings and golden fixtures
        run: >
          TS_RS_EXPORT_DIR=src/wasm/js/generated cargo test --features ts-rs,rislive

      - name: Verify generated files are up to date
        run: git diff --exit-code -- src/wasm/js/generated src/wasm/test/fixtures

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type-check fixtures against shipped definitions
        working-directory: src/wasm/test/type-check
        run: |
          npm ci
          npm run check

  msrv:
    name: Check MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.cargo/bin
      - name: Install cargo-msrv
        run: cargo install cargo-msrv --locked
      - name: Verify MSRV
        run: cargo msrv verify
